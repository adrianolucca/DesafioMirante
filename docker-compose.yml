version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_desafio
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - desafio-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  web:
    build:
      context: .
      dockerfile: DesafioMiranteWeb/Dockerfile
    container_name: desafio_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - desafio-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=DesafioMiranteDb;User Id=sa;Password=Your_password123;

networks:
  desafio-network:
    driver: bridge
